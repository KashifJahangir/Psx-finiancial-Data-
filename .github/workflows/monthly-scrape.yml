name: PSX scraper

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "ALL = every stock, or symbols separated by spaces (e.g. HUBC ENGRO)"
        required: true
        default: "ALL"
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 03:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml yfinance

      - name: Run scraper
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          echo "Symbols input: '$SYMBOLS'"
          if [ -z "$SYMBOLS" ] || [ "$SYMBOLS" = "ALL" ] || [ "$SYMBOLS" = "all" ]; then
            echo "Running ALL stocks"
            python scrape_psx_all.py --resume
          else
            echo "Running only: $SYMBOLS"
            python scrape_psx_all.py --resume --symbols $SYMBOLS
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add PSX_All_Fundamentals.json debug_*.html || true
          git commit -m "Update PSX fundamentals $(date +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
